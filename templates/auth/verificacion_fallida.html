<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error de verificación - Global Exchange</title>
</head>
<body>
    <h1>Error de verificación</h1>
    <p>No pudimos verificar tu correo electrónico. Esto puede deberse a:</p>
    <ul>
        <li>El enlace de verificación expiró.</li>
        <li>El enlace ya fue utilizado anteriormente.</li>
        <li>El enlace no es válido.</li>
    </ul>
    <p>Por favor <a href="/oidc/authenticate/">intentá iniciar sesión nuevamente</a> para recibir un nuevo correo de verificación.</p>
</body>
</html>
